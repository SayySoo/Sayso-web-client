name: Deploy SaySo to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Validate production environment variables
      - name: Verify production configuration
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "::error::NEXT_PUBLIC_API_URL is missing from GitHub Secrets"
            exit 1
          fi

          case "$NEXT_PUBLIC_API_URL" in
            http://*|https://*)
              echo "SUCCESS: NEXT_PUBLIC_API_URL is configured"
              ;;
            *)
              echo "::error::NEXT_PUBLIC_API_URL must start with http:// or https://"
              exit 1
              ;;
          esac

      # 5. Build and Deploy
      - name: Build and Deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
